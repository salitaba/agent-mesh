<!doctype html>
<!--
  The smoke page for `tools/ux-render.mjs`, rendered at image build time. It clears every floor the tool
  enforces: 44px controls, 4.5:1 text on the surface it sits on, 3:1 boundaries, no horizontal overflow at
  390px, two type sizes and one spacing rhythm. A tool that cannot render this page cannot render a
  product, and a check that passes everything this page fails is a check that measures nothing — the
  build renders `ux-bad.html` too, and requires it to fail.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oven timer</title>
    <style>
      :root { --ink: #16181d; --ink-dim: #55595f; --surface: #ffffff; --line: #767a80; --accent: #1b4fd8; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--surface); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
      main { max-width: 420px; padding: 16px; }
      h1 { font-size: 24px; line-height: 1.3; font-weight: 700; margin: 0 0 16px; }
      p { margin: 0 0 16px; }
      .dim { color: var(--ink-dim); }
      .row { display: flex; gap: 8px; margin-bottom: 16px; }
      button, a.action {
        font: inherit; min-width: 44px; min-height: 44px; padding: 8px 16px;
        border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink);
      }
      a.action { display: inline-flex; align-items: center; text-decoration: none; color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main aria-label="Oven timer">
      <h1>Oven timer</h1>
      <p>Set a timer for the bake. It rings in this room, not on your phone.</p>
      <p class="dim">Nothing is running. Press Start after you close the door.</p>
      <div class="row">
        <button class="primary" type="button">Start</button>
        <button type="button">Reset</button>
      </div>
      <p><a class="action" href="#settings">Timer settings</a></p>
    </main>
  </body>
</html>
