version: 1

mesh:
  id: payment-api-team
  name: Payment API Engineering Team

  goal: |
    Build a production-ready payment API using Spring Boot.

  workspace:
    path: ./workspace

  runtime:
    default: claude

startup:
  activate:
    - pm
    - architect

agents:

  architect:
    role: architect
    runtime: claude
    prompt: ../../roles/architect.md

    capabilities:
      - repository.read
      - architecture.write
      - review.design

    authority:
      - architecture.approve

    interests:
      - architecture.*
      - design.question
      - dependency.changed
      - goal.escalated

    session:
      persistent: true

  tech-lead:
    role: tech-lead
    runtime: claude
    prompt: ../../roles/tech-lead.md

    capabilities:
      - repository.read
      - architecture.read
      - code.review
      - review.design          # allows reviewing architecture documents
      - task.assign
      - git.merge

    authority:
      - implementation.approve
      # roles/tech-lead.md makes this seat the design gate, and a plain
      # `approve architecture` (no artifactId) is checked against AUTHORITY,
      # not capabilities — without this the documented gate always denied.
      - architecture.approve

    interests:
      - patch.ready
      - implementation.completed
      - goal.progress

  developer:
    role: developer
    runtime: claude
    prompt: ../../roles/developer.md

    capabilities:
      - repository.read
      - repository.write
      - test.execute
      - git.commit

    interests:
      - architecture.approved
      - review.rejected

    session:
      persistent: true

  qa:
    role: qa
    runtime: claude
    prompt: ../../roles/qa.md

    capabilities:
      - repository.read
      - test.execute
      - test.write

    authority:
      - quality.block
      - quality.pass

    interests:
      - patch.ready
      - implementation.completed
      - release.candidate

  security:
    role: security
    runtime: claude
    prompt: ../../roles/security.md

    capabilities:
      - repository.read
      - security.scan
      - security.review

    authority:
      - security.block
      - security.pass

    interests:
      - authentication.changed
      - authorization.changed
      - dependency.changed
      - release.candidate

  explorer:
    role: explorer
    runtime: claude
    prompt: ../../roles/explorer.md

    mode: service

    capabilities:
      - repository.read

    interests:
      - research.requested

  pm:
    role: product-manager
    runtime: claude
    prompt: ../../roles/pm.md

    capabilities:
      - repository.read

    authority:
      - requirements.accept

    interests:
      - requirement.blocked
      - goal.progress
      - goal.completed

policies:

  communication:

    architect:
      may_contact:
        - developer
        - tech-lead
        - explorer
        - pm

    developer:
      may_contact:
        - architect
        - tech-lead
        - explorer
        - qa
        - security

    qa:
      may_contact:
        - developer
        - tech-lead
        - architect
        - security

    tech-lead:
      may_contact:
        - architect
        - developer
        - qa
        - security
        - pm
        - explorer

    security:
      may_contact:
        - developer
        - tech-lead
        - qa
        - architect

    pm:
      may_contact:
        - architect
        - tech-lead
        - developer

    explorer:
      may_contact:
        - architect
        - tech-lead
        - developer
        - qa
        - security
        - pm

  transitions:

    implementation.completed:
      requires:
        - tech-lead.approve
        - qa.pass

    release.accepted:
      requires:
        - qa.pass
        - security.pass

    patch.merge:
      requires:
        - tech-lead.approve

  escalation:

    thread:
      max_depth: 8

    repeated_conflict:
      threshold: 3

    artifact_review_rounds:
      max: 5

budgets:

  mission:
    tokens: 2000000
    wall_clock_minutes: 240
    max_events: 10000

  agent:
    architect: 300000
    developer: 700000
    qa: 200000
    security: 200000
    explorer: 100000
    tech-lead: 250000
    pm: 150000

  thread:
    tokens: 50000

bus:
  # The manifest a seat is shown. `mesh init` has written this for every mesh
  # it scaffolds since the key existed; these examples predate it, so they were
  # teaching the 24-name typed surface to anyone who read them to learn the
  # system. Collapsing it takes no capability away -- the tools it hides stay
  # callable by name -- and the kernel never reads the key: it is consumed in
  # exactly one place, where the MCP manifest is built.
  vocabulary: contracts
  commitments:
    # Hold an ask that named no contract to the one its type implies, the way
    # `mesh init` now does. Without it the eight contracts are decoration a
    # sender may opt into, and a bare REQUEST_REVIEW opens a debt with no
    # refusal vocabulary, no SLA and no answer shape. These examples set no
    # `ttl_ms`, so nothing here creates a deadline -- what it buys is the
    # closed refusal set (quoted to the debtor in its own prompt) and a
    # verdict on whether an answer actually answered.
    by_type: true
  # Price attention, the way `mesh init` does for every mesh it scaffolds.
  # Without this block every message wakes each of its recipients the instant
  # it is sent, and a wake is a full model turn -- so these examples were
  # demonstrating a mesh no new user is given. Every class still lands in the
  # mailbox; only the wake differs. The generated mesh.yaml from `mesh init`
  # annotates each key in full.
  delivery:
    classes: true
    # Shorter than the 60s default that `mesh init` writes: these examples are
    # meant to be watched, and a minute of gathering reads as a stall. Measured
    # on examples/demo-stub, which converges in ~3s at this window and ~6s at
    # 5000 -- most bursts are drained by a turn the seat was taking anyway.
    coalesce_ms: 2000
    interrupt_cost_tokens: 2000
    attention_tokens: 200000
    # How many unread messages in the RECIPIENT's box add one unit to the price
    # of waking them, capped at 4x. The flat tariff charges the same for
    # waking an idle seat and the seat everyone is already queuing behind.
    congestion_every: 4

scheduling:

  mode: event-driven

  concurrency:
    max_active_agents: 4

server:
  port: 7420
  dashboard: true
