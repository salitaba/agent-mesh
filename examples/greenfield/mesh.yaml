version: 1

mesh:
  id: greenfield-service
  name: Greenfield Service Team

  goal: |
    Build a small notification service from the attached specification:
    design, implement, test, and deliver a runnable artifact.

  acceptance_criteria:
    - { id: spec-understood, description: "A research/spec artifact exists" }
    - { id: architecture-approved, description: "Architecture reviewed and approved" }
    - { id: implementation-merged, description: "Implementation merged with green tests" }

  workspace:
    path: ./workspace

  runtime:
    default: claude

startup:
  activate:
    - architect

agents:

  architect:
    role: architect
    runtime: claude
    prompt: ../../roles/architect.md
    # `git.merge` and `requirements.accept` are here because this mesh has no
    # tech-lead and no pm, and without them it could not finish: `patch.merge` is
    # a configured gate that no seat could satisfy, and `spec-understood` is a
    # mandatory criterion the runtime never auto-evidences, so it closes only via
    # `approve subject:"criterion:spec-understood"`. Config validation now warns
    # about both.
    capabilities: [repository.read, architecture.write, review.design, code.review, git.merge]
    authority: [architecture.approve, implementation.approve, requirements.accept]
    interests: [architecture.*, design.question, goal.escalated]

  developer:
    role: developer
    runtime: claude
    prompt: ../../roles/developer.md
    capabilities: [repository.read, repository.write, test.execute, git.commit, code.review]
    interests: [architecture.approved, review.rejected]

  qa:
    role: qa
    runtime: claude
    prompt: ../../roles/qa.md
    capabilities: [repository.read, test.execute, test.write]
    authority: [quality.block, quality.pass]
    interests: [patch.ready, implementation.completed]

policies:

  communication:
    architect: { may_contact: [developer, qa] }
    developer: { may_contact: [architect, qa] }
    qa: { may_contact: [architect, developer] }

  transitions:
    patch.merge: { requires: [architect.approve] }

  escalation:
    thread: { max_depth: 5 }
    repeated_conflict: { threshold: 3 }
    artifact_review_rounds: { max: 4 }

budgets:
  mission: { tokens: 800000, wall_clock_minutes: 120, max_events: 5000 }
  agent:
    architect: 200000
    developer: 400000
    qa: 150000
  thread: { tokens: 40000 }

bus:
  # The manifest a seat is shown. `mesh init` has written this for every mesh
  # it scaffolds since the key existed; these examples predate it, so they were
  # teaching the 24-name typed surface to anyone who read them to learn the
  # system. Collapsing it takes no capability away -- the tools it hides stay
  # callable by name -- and the kernel never reads the key: it is consumed in
  # exactly one place, where the MCP manifest is built.
  vocabulary: contracts
  commitments:
    # Hold an ask that named no contract to the one its type implies, the way
    # `mesh init` now does. Without it the eight contracts are decoration a
    # sender may opt into, and a bare REQUEST_REVIEW opens a debt with no
    # refusal vocabulary, no SLA and no answer shape. These examples set no
    # `ttl_ms`, so nothing here creates a deadline -- what it buys is the
    # closed refusal set (quoted to the debtor in its own prompt) and a
    # verdict on whether an answer actually answered.
    by_type: true
  # Price attention, the way `mesh init` does for every mesh it scaffolds.
  # Without this block every message wakes each of its recipients the instant
  # it is sent, and a wake is a full model turn -- so these examples were
  # demonstrating a mesh no new user is given. Every class still lands in the
  # mailbox; only the wake differs. The generated mesh.yaml from `mesh init`
  # annotates each key in full.
  delivery:
    classes: true
    # Shorter than the 60s default that `mesh init` writes: these examples are
    # meant to be watched, and a minute of gathering reads as a stall. Measured
    # on examples/demo-stub, which converges in ~3s at this window and ~6s at
    # 5000 -- most bursts are drained by a turn the seat was taking anyway.
    coalesce_ms: 2000
    interrupt_cost_tokens: 2000
    attention_tokens: 200000
    # How many unread messages in the RECIPIENT's box add one unit to the price
    # of waking them, capped at 4x. The flat tariff charges the same for
    # waking an idle seat and the seat everyone is already queuing behind.
    congestion_every: 4

scheduling:
  mode: event-driven
  triage:
    mode: heuristic
    rules:
      # Cheap suppression layer: never wake qa for pure documentation churn,
      # but always wake on schema/auth changes. Triage itself must stay cheaper
      # than the activation it filters (§25).
      - agent: qa
        event: dependency.changed
        ignore_if_text_matches: ["README", "docs/"]
        act_if_text_matches: ["pom.xml", "build.gradle", "schema"]
  concurrency:
    max_active_agents: 2
  timeouts:
    turn_timeout_ms: 300000
    wait_wakeup_ms: 90000
