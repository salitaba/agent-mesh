# The Android app's compile gate, and the only place an APK is produced.
#
# The same crate as the desktop shell (apps/desktop/src-tauri), built for Android.
# Nobody on the machine it was written on can build it: no Rust, no JDK, no Android
# SDK, no NDK, and installing any of them is out of scope — so this workflow is where
# the crate is first compiled for the four Android targets, and where the first
# compile error will be read. The APK is signed here, and the signature is verified
# before it leaves the runner — see the note at the bottom.

name: Mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes, so a `desktop-v*` tag always
    # builds: that tag is the one release this repository cuts, and the phone's
    # installer belongs in it (see the last step of the job).
    tags: ["desktop-v*"]
    paths:
      - apps/desktop/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - apps/desktop/**
      - .github/workflows/mobile.yml

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-22.04
    # Four ABIs, each with the whole crate's dependency tree to compile, and a
    # Gradle build on top. Sixty minutes is the desktop job's budget and is not
    # enough for this one.
    timeout-minutes: 90
    # Write, for one case only: a `desktop-v*` tag. The APK is a run artifact on a
    # branch or a pull request, and on a tag it is also attached to the release
    # `desktop.yml` cuts — `gh release upload` needs the scope.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Android Gradle plugin needs a JDK, and the version matters: the project
      # Tauri 2.12 generates pins Gradle 9.6 in its wrapper, which runs on Java up to
      # 26, and Tauri's own Android workflow builds with temurin 25.
      #
      # No `cache: gradle` here: the Gradle project is generated further down, so at
      # this point there is no `*.gradle*` file in the tree for the cache key to hash
      # and setup-java fails the job outright ("No file … matched to [**/*.gradle*]",
      # observed on the first run). Caching `~/.gradle` is a separate `actions/cache`
      # step, after `init` has written the project, if it is worth it later.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # All four Android ABIs: the APK is universal (one .so per ABI inside it)
          # unless `--split-per-abi` says otherwise.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      # Pinned, because the CLI pins one too: NDK_VERSION in
      # crates/tauri-cli/src/mobile/android/mod.rs is 29.0.13846066 (r29) for the
      # 2.12 line, and matching it means the toolchain the Gradle project links
      # against is the one the CLI would have installed for itself.
      - name: The Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: true

      # The NDK ships symlinks that point into the archive they were unpacked from,
      # which a restored cache leaves dangling. Tauri's own Android workflow carries
      # this workaround while nttld/setup-ndk#518 is open.
      - name: Restore the NDK's symlinks
        env:
          NDK_HOST: linux-x86_64
        run: |
          directory="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/$NDK_HOST/bin"
          find "$directory" -type l | while read -r link; do
            target=$(readlink "$link")
            ln -sf "$directory/$(basename "$target")" "$link"
          done

      - name: Cache the crate's dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: android

      - run: npm ci

      # The generated project is not committed, and cannot be: `tauri android init`
      # shells out to `cargo metadata` before it looks at any SDK, so the machine
      # this was written on could not produce one, and a Gradle project generated by
      # a different CLI version is worse than no project at all. It is generated here
      # instead, from the CLI the app's own devDependency pins, on every run.
      # `--skip-targets-install`: the four Android targets are already installed.
      - name: Generate the Android project
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri -- android init --ci --skip-targets-install

      # The runner image carries an SDK, but not the platform this project compiles
      # against — and that platform cannot be named by hand. From API 36.1 on Google
      # publishes minor-versioned platforms, so `platforms;android-37` does not exist
      # while `platforms;android-37.0` … `37.2` do: the first run of this workflow died
      # on exactly that guess ("Failed to find package 'platforms;android-37'").
      # So the API is read from the project `init` just generated (compileSdk = 37 in
      # tauri 2.12.3's template) and the newest published package for it is installed,
      # which is also what keeps this working when the template moves to 38.
      # After `init` on purpose: before it there is no project to read the API from.
      - name: The Android SDK platform the project compiles against
        run: |
          sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || sdkmanager="$(command -v sdkmanager)"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platform-tools"
          gradle=apps/desktop/src-tauri/gen/android/app/build.gradle.kts
          api=$(grep -oE 'compileSdk *= *[0-9]+' "$gradle" | grep -oE '[0-9]+' | head -1)
          if [ -z "$api" ]; then
            echo "::error::no compileSdk in $gradle — the template changed shape"
            exit 1
          fi
          echo "the generated project compiles against API $api"
          package=$("$sdkmanager" --list | grep -oE "platforms;android-$api(\.[0-9]+)?" | sort -uV | tail -1)
          if [ -z "$package" ]; then
            echo "::error::no published SDK platform for API $api; the repository offers:"
            "$sdkmanager" --list | grep -oE 'platforms;android-[0-9]+(\.[0-9]+)?' | sort -uV | tail -4
            exit 1
          fi
          echo "installing $package"
          "$sdkmanager" "$package"

      # After init, on purpose: `tauri icon` writes the Android launcher icons into
      # the generated project (gen/android/app/src/main/res) when it exists, and into
      # src-tauri/icons/android when it does not. The launcher icon is read from the
      # project, and it is rendered from the same 1024px master the desktop
      # installers use.

      - name: Render the icon set onto the generated project
        working-directory: apps/desktop
        run: npm run icon -- icon.png

      # Tauri's own activity calls `enableEdgeToEdge()`, which is right — the app's background should reach the screen's
      # edges — but nothing then keeps the platform's furniture out of the way, and on a real phone (13 October 2026)
      # the status bar's clock and battery were drawn straight over the app's header. The fix is the one Android's own
      # guidance gives for an app that has opted into edge to edge: pad the content by the inset the platform reports.
      # It happens here because the Android project is generated per run and nobody on the author's machine can compile
      # Kotlin — and the anchor is checked, so a template that changes shape fails loudly instead of quietly doing
      # nothing.
      - name: Keep the status bar out of the app's header
        run: |
          activity=$(find apps/desktop/src-tauri/gen/android/app/src/main -name 'MainActivity.kt' | head -1)
          if [ -z "$activity" ]; then
            echo "::error::MainActivity.kt was not generated where this expects it"
            exit 1
          fi
          python3 - "$activity" <<'PY'
          import pathlib, sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          anchor = "super.onCreate(savedInstanceState)"
          if anchor not in source:
              sys.exit(f"::error::{path} has no onCreate to patch: the template changed shape")
          if "setOnApplyWindowInsetsListener" in source:
              print(f"{path} is already patched")
              raise SystemExit(0)
          patch = """
              // The window is edge to edge (Tauri's activity calls enableEdgeToEdge), so the platform's own furniture
              // has to be kept out of the way by hand: without this the status bar's clock and battery are drawn over
              // the app's own header. The inset is the platform's own measurement of that furniture, and padding the
              // content by it is the whole fix.
              val content = findViewById<android.view.View>(android.R.id.content)
              ViewCompat.setOnApplyWindowInsetsListener(content) { view, insets ->
                val bars = insets.getInsets(WindowInsetsCompat.Type.systemBars() or WindowInsetsCompat.Type.displayCutout())
                view.setPadding(bars.left, bars.top, bars.right, bars.bottom)
                insets
              }
          """
          source = source.replace(anchor, anchor + "\n" + patch, 1)
          lines = source.split("\n")
          last = max(index for index, line in enumerate(lines) if line.startswith("import "))
          lines[last + 1:last + 1] = [
              "import androidx.core.view.ViewCompat",
              "import androidx.core.view.WindowInsetsCompat",
          ]
          path.write_text("\n".join(lines))
          print(f"patched {path}")
          PY
          grep -n "setOnApplyWindowInsetsListener\|^import androidx.core" "$activity"

      # APKs only. An AAB is what Play takes, and Play refuses an unsigned one, so
      # building one here would produce a file nobody can use — see the note below.
      - name: Build the APK
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: npm run tauri -- android build --apk --ci

      # Android refuses to install an APK that is not signed, and the build above produces exactly that
      # (`app-universal-release-unsigned.apk`): without this step the run succeeds, the artifact downloads and the file
      # cannot be installed by anyone. A signing step that silently did nothing would look the same from here, so the
      # signature is verified on the runner — `apksigner verify --print-certs` — before the APK is uploaded. The
      # keystore is a repository secret; no password is written into this file or printed.
      - name: Sign the APK, and verify what was signed
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK was built"
            exit 1
          fi
          keystore="$RUNNER_TEMP/curule-signing.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
          apksigner=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/lib/android-sdk}}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ] || [ ! -x "$apksigner" ]; then
            echo "::error::apksigner was not found in the SDK's build-tools"
            exit 1
          fi
          "$apksigner" sign --ks "$keystore" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --key-pass env:ANDROID_KEY_PASSWORD "$apk"
          "$apksigner" verify --print-certs "$apk"
          rm -f "$keystore"
          # The build's own name is `app-universal-release-unsigned.apk`, and after this step that name is a lie: the
          # next person to look at the run's artifacts should not have to open the file to find out which it is.
          if [ "${apk%-unsigned.apk}" != "$apk" ]; then
            mv "$apk" "${apk%-unsigned.apk}.apk"
            apk="${apk%-unsigned.apk}.apk"
          fi
          echo "signed $(basename "$apk")"

      # The APK is the run's output even when nothing is released: no release is cut
      # here at all, so the artifact is how an APK reaches a person.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: curule-android-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # A `desktop-v*` tag is the one release this repository cuts, and `desktop.yml`
      # is what cuts it — the four desktop installers on a draft. The phone's installer
      # belongs on the same page: same version, same product. This waits for that draft
      # to exist (the two workflows start together and neither is ordered against the
      # other) and then attaches the APK to it, under the name the installers use.
      - name: Attach the APK to the release the tag cuts
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"
          for attempt in $(seq 1 40); do
            if gh release view "$tag" > /dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              echo "::error::$tag has no release to attach to — desktop.yml is what creates it"
              exit 1
            fi
            sleep 15
          done
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$apk" ]; then
            echo "::error::no APK was built"
            exit 1
          fi
          cp "$apk" "Curule_${version}_android.apk"
          gh release upload "$tag" "Curule_${version}_android.apk" --clobber
          echo "attached Curule_${version}_android.apk to $tag"

# The APK is signed with the app's own key, kept as repository secrets
# (ANDROID_KEYSTORE_BASE64 — a PKCS#12 bundle — ANDROID_KEY_ALIAS,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD). The same key signs every
# release, which is what lets a new APK install over the last one: Android refuses
# an update whose signature differs, and an unsigned APK it refuses outright. The
# key's certificate is valid for thirty years and its fingerprint is worth writing
# down wherever the app is described — a lost keystore means every future release
# needs an uninstall first.
#
# Google Play is a different door and out of scope: it takes an app bundle (an AAB,
# not this APK, which is why one is not built here), a Play Console developer
# account, and its own upload key. An unsigned AAB is of no use to it either.
#
# iOS is out of scope for this pass, and half-wiring it would be worse than saying
# so: it needs a macOS runner, Xcode, an Apple Developer account and a provisioning
# profile, none of which exist yet. When they do, it is a `macos-14` job running
# `tauri ios init --ci` and `tauri ios build --ci`, against the same crate and the
# same mobile capability file this job already covers.