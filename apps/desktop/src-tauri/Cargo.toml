[package]
name = "curule-desktop"
version = "0.1.0"
description = "The Curule desktop shell: the hosted app in a native window."
authors = ["Ali Tabatabaei"]
edition = "2021"
# The floor the tauri crate itself declares (2.12.3); CI installs stable.
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the library's name apart from the binary's: the two would
# otherwise collide on Windows (rust-lang/cargo#8519).
name = "curule_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# Both of these are desktop crates: their lib.rs is
# `#![cfg(not(any(target_os = "android", target_os = "ios")))]`, so on Android they
# compile to an empty crate and every item they export is registered behind
# `#[cfg(desktop)]` in src/lib.rs. They stay listed for every target because the
# mobile build resolves them to nothing rather than failing.
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The size profile from the Tauri documentation (concept/size).
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
