<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Mesh</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%236d8dff'/><circle cx='27' cy='9' r='3' fill='%2343d6a0'/><circle cx='5' cy='9' r='3' fill='%23f0b429'/><circle cx='8' cy='26' r='3' fill='%23f0717f'/><path d='M16 16 27 9M16 16 5 9M16 16 8 26' stroke='%2340507a' stroke-width='1.4'/></svg>" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26"><circle cx="16" cy="16" r="5" fill="var(--accent)"/><circle cx="27" cy="9" r="3" fill="var(--ok)"/><circle cx="5" cy="9" r="3" fill="var(--warn)"/><circle cx="8" cy="26" r="3" fill="var(--bad)"/><path d="M16 16 27 9M16 16 5 9M16 16 8 26" stroke="var(--line-strong)" stroke-width="1.4"/></svg>
        <div><b>Agent&nbsp;Mesh</b><span id="mesh-id" class="sub"></span></div>
      </div>
      <nav id="nav" aria-label="views">
        <button data-view="overview"  class="tab"><i>◧</i>Overview<em class="kbd">1</em></button>
        <button data-view="agents"    class="tab"><i>◉</i>Agents<em class="kbd">2</em></button>
        <button data-view="graph"     class="tab"><i>◈</i>Graph<em class="kbd">3</em></button>
        <button data-view="events"    class="tab"><i>≋</i>Events<em class="kbd">4</em></button>
        <button data-view="artifacts" class="tab"><i>▤</i>Artifacts<em class="kbd">5</em></button>
        <button data-view="cost"      class="tab"><i>¤</i>Cost<em class="kbd">6</em></button>
        <button data-view="escalations" class="tab"><i>⚑</i>Escalations<em class="kbd" id="esc-badge"></em></button>
        <button data-view="designer"  class="tab"><i>⚒</i>Designer<em class="kbd">7</em></button>
      </nav>
      <div class="side-foot">
        <button id="btn-theme" class="ghost" title="toggle theme">◐ theme</button>
        <button id="btn-help" class="ghost" title="keyboard shortcuts">? help</button>
      </div>
    </aside>

    <header id="topbar">
      <div id="goal-strip">
        <span class="pulse-dot" id="live-dot" title="SSE connection"></span>
        <strong id="top-goal">connecting…</strong>
        <span id="top-criteria" class="muted"></span>
      </div>
      <div id="top-stats"></div>
      <div class="top-actions">
        <button id="btn-pause" class="soft" title="pause mission">❚❚ pause</button>
        <button id="btn-resume" class="soft hidden" title="resume mission">▶ resume</button>
        <button id="btn-message" class="soft">✉ message</button>
        <button id="btn-approval" class="soft">✓ approval</button>
      </div>
    </header>

    <main id="view" tabindex="-1"></main>
  </div>

  <div id="drawer" class="drawer hidden" role="dialog" aria-modal="false"><div id="drawer-body"></div></div>
  <div id="scrim" class="hidden"></div>
  <div id="toasts" aria-live="polite"></div>

  <template id="tpl-help">
    <div class="help">
      <h2>Keyboard</h2>
      <table>
        <tr><td><kbd>1</kbd>…<kbd>7</kbd></td><td>switch view</td></tr>
        <tr><td><kbd>/</kbd></td><td>focus search (events)</td></tr>
        <tr><td><kbd>Esc</kbd></td><td>close drawer</td></tr>
        <tr><td><kbd>p</kbd> / <kbd>r</kbd></td><td>pause / resume mission</td></tr>
        <tr><td><kbd>t</kbd></td><td>toggle theme</td></tr>
        <tr><td><kbd>?</kbd></td><td>this help</td></tr>
      </table>
      <h2>About</h2>
      <p class="muted">Every screen is a projection of the append-only event log.
      The ✉ / ✓ controls act as the <code>human</code> seat; the designer validates
      configs server-side with the same engine as <code>mesh validate</code>.
      Tip: <code>mesh ui &lt;file&gt;</code> opens this console without running any agents.</p>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
