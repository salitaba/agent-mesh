<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ordane</title>
  <script>
    // Theme bootstrap (UIR-07). Runs before first paint so a returning
    // light-theme user never sees the dark flash that a post-mount
    // localStorage read produced. Precedence: saved choice > OS > dark.
    // Kept in sync by hand with store.tsx's mount effect.
    (function () {
      try {
        var saved = localStorage.getItem("mesh-theme");
        var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = (saved === "light" || saved === "dark") ? saved : sys;
      } catch (e) { /* keep the dark fallback written on <html> */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%236d8dff'/><circle cx='27' cy='9' r='3' fill='%2343d6a0'/><circle cx='5' cy='9' r='3' fill='%23f0b429'/><circle cx='8' cy='26' r='3' fill='%23f0717f'/><path d='M16 16 27 9M16 16 5 9M16 16 8 26' stroke='%2340507a' stroke-width='1.4'/></svg>" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
