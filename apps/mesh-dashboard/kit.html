<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <!-- The kit gallery: every primitive of the console in every state, in both themes. It shows no data and asks for no sign-in. -->
  <meta name="robots" content="noindex" />
  <title>Curule console kit</title>
  <script>
    // Theme bootstrap (UIR-07). Runs before first paint so a returning
    // light-theme user never sees the dark flash that a post-mount
    // localStorage read produced. Precedence: saved choice > OS > dark.
    // Kept in sync by hand with store.tsx's mount effect.
    (function () {
      try {
        var saved = localStorage.getItem("mesh-theme");
        var sys = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = (saved === "light" || saved === "dark") ? saved : sys;
      } catch (e) { /* keep the dark fallback written on <html> */ }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cstyle%3E.ink%7Bstroke:%231c1b1a%7D.seat%7Bfill:%232b5fd9%7D@media%20(prefers-color-scheme:dark)%7B.ink%7Bstroke:%23efece6%7D.seat%7Bfill:%237ba0ff%7D%7D%3C/style%3E%3Cpath%20class='ink'%20d='M48.72%2015.65A22%2022%200%201%200%2048.72%2048.35'%20fill='none'%20stroke-width='9.2'%20stroke-linecap='round'/%3E%3Ccircle%20class='seat'%20cx='48.72'%20cy='15.65'%20r='8'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="root"></div>
  <noscript><p style="font: 16px/1.5 system-ui, sans-serif; padding: 24px; max-width: 60ch">The kit gallery is drawn by the console's own components and needs JavaScript. Turn it on for this address and reload the page.</p></noscript>
  <script type="module" src="/src/kit.tsx"></script>
</body>
</html>
